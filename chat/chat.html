<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            background: #f3f3f3; display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .chat-container {
            width: 400px; background: white; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex; flex-direction: column;
        }
        .chat-header {
            background: #007bff; color: white; padding: 10px;
            text-align: center; font-size: 18px; border-radius: 8px 8px 0 0;
        }
        .chat-messages {
            flex: 1; padding: 10px; overflow-y: auto;
        }
        .chat-input {
            display: flex; border-top: 1px solid #ddd;
        }
        .chat-input input {
            flex: 1; padding: 10px; border: none; outline: none;
        }
        .chat-input button {
            padding: 10px; background: #007bff; color: white;
            border: none; cursor: pointer;
        }
        .chat-messages .message {
            margin: 5px 0; padding: 8px 12px; border-radius: 5px;
        }
        .user { background: #007bff; color: white; text-align: right; }
        .bot { background: #ddd; text-align: left; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Chat Room</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
            <button onclick="clearLocalStorage()">Limpar Chat</button>
        </div>
    </div>

    <script src="script.js"></script>

    
</body>
</html>
