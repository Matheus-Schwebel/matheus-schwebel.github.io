<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 0 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 90%;
            overflow: hidden;
        }

        .chat-header {
            background: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px 10px 0 0;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f9f9f9;
            border-bottom: 2px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-messages .message {
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 70%;
            word-wrap: break-word;
            font-size: 16px;
            line-height: 1.4;
        }

        .user {
            background: #007bff;
            color: white;
            align-self: flex-end;
            border-radius: 20px 20px 0 20px;
        }

        .bot {
            background: #ddd;
            align-self: flex-start;
            border-radius: 20px 20px 20px 0;
        }

        .chat-input {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-top: 2px solid #eee;
            background: #fff;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ddd;
            outline: none;
        }

        .chat-input input:focus {
            border-color: #007bff;
        }

        .chat-input button {
            padding: 12px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .chat-input button:hover {
            background: #0056b3;
        }

        .chat-input button:active {
            background: #00428b;
        }

        .chat-container button {
            padding: 10px 20px;
            background: #f7f7f7;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            align-self: center;
            transition: background 0.3s;
        }

        .chat-container button:hover {
            background: #e2e2e2;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Chat Room</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
        <div class="chat-input">
            <button onclick="clearLocalStorage()">Clear Chat</button>
            <button onclick="setTimeout(recarregarPagina, 3000);">🔃</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
